<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel macro Chile</title>
  <script>
    // En teléfonos se abre la versión móvil, salvo que se haya elegido la de computador.
    (function () {
      var pref = null;
      try { pref = localStorage.getItem("panel-macro:version"); } catch (e) {}
      var narrow = window.matchMedia("(max-width: 760px)").matches;
      var touch = window.matchMedia("(pointer: coarse)").matches || navigator.maxTouchPoints > 0 || /Mobi|Android|iPhone|iPod/i.test(navigator.userAgent);
      var phone = narrow && touch;
      if (pref === "movil" || (pref !== "computador" && phone)) location.replace("movil.html" + location.hash);
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f2a4a'/%3E%3Cpath d='M7 22l6-7 5 4 7-9' fill='none' stroke='%236da7ec' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Macro Chile">
  <meta name="theme-color" content="#0f2a4a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- KaTeX dibuja las fórmulas de "¿Cómo se calcula?". Sin conexión se muestra el texto TeX. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="desktop.css">
</head>
<body data-version="computador">
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-name">Panel macro Chile</span>
        <span class="brand-source">Series de la Base de Datos Estadísticos del Banco Central de Chile</span>
      </div>
      <nav class="nav" id="nav" aria-label="Secciones"></nav>
      <div class="sidebar-foot">
        <p id="status" role="status">Cargando datos…</p>
        <a class="version-link" id="switch-version" href="movil.html" data-version="movil">Ver versión para teléfono</a>
      </div>
    </aside>

    <main class="main">
      <section class="strip" id="strip" aria-label="Valores del día"></section>

      <div class="toolbar">
        <div class="toolbar-start" id="chart-controls">
          <div class="ranges" id="ranges" role="group" aria-label="Período de los gráficos"></div>
          <div class="zoom" id="zoom" aria-live="polite"></div>
        </div>
        <div class="toolbar-end">
          <span class="updated" id="updated"></span>
          <button class="btn" id="refresh" type="button">Actualizar datos</button>
        </div>
      </div>

      <header class="section-head">
        <h1 id="section-title"></h1>
        <p id="section-intro"></p>
      </header>

      <div class="cards" id="cards"></div>
    </main>
  </div>

  <script src="plot.js"></script>
  <script src="indicators.js"></script>
  <script src="explanations.js"></script>
  <script src="converter.js"></script>
  <script src="app.js"></script>
</body>
</html>
